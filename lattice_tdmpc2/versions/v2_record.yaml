  world_model_final: logs/residual_sac/lattice_tdmpc_sacl_online_wm_v2_seed1/world_model_final.pt

training:
  seed: 1
  steps: 1000000
  horizon: 3
  scenarios: {start_seed: 100, num_scenarios: 50}
  traffic_density: 0.1
  accident_prob: 0.8
  planner: lattice_tdmpc_sac
  world_model_mode: online
  freeze_tdmpc2: false
  online_wm_update_every: 1
  residual_selection: one_direct_sac_output
  action_mapping: symmetric_coarse_speed_v2
  delta_d_max: 0.4
  include_wm_return_in_state: true
  include_wm_cost_in_state: true

sac:
  hidden_sizes: [256, 256]
  replay_size: 200000
  batch_size: 256
  gamma: 0.99
  tau: 0.05
  actor_lr: 0.0005
  critic_lr: 0.001
  alpha_lr: 0.0003
  alpha_initial: 0.005
  auto_alpha: true

constraint:
  implementation: pid_lagrangian
  cost_limit: 10.0
  pid: [0.05, 0.0005, 0.1]
  unsafe_residual_cost: 1.0
  episode_cost: "environment_cost + count(unsafe_residual)"

losses:
  reward_critic: "MSE(Q1,y_reward) + MSE(Q2,y_reward)"
  cost_target: "c_constraint + gamma * max(target_QC1,target_QC2)"
  cost_critic: "MSE(QC1,y_cost) + MSE(QC2,y_cost)"
  actor: "(L_SAC + lambda * max(QC1,QC2)) / (1+lambda) + 0.01 * L_trust"

