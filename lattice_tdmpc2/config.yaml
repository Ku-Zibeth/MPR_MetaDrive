defaults:
  - _self_

# Saved into all future SAC checkpoints and W&B configs. Historical V1/V2
# checkpoints predate this explicit marker; see lattice_tdmpc2/versions/.
algorithm_version: lattice_tdmpc2_v3

# MetaDrive task
task: metadrive-risk
obs: state
episodic: true

# Evaluation
checkpoint: null
eval_episodes: 10
eval_freq: 50000

# Training
steps: 1000000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1.0
consistency_coef: 20.0
rho: 0.5
lr: 0.0003
enc_lr_scale: 0.3
grad_clip_norm: 20.0
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1000000
seed_steps: 5000
exp_name: default
data_dir: null

# MPPI planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2.0
temperature: 0.5

planner:
  type: mppi
  final_cost_lambda: 0.0
  num_candidates: 64

# Frenet Lattice geometry and tracking. Defaults not listed here come from
# lattice/frenet_metadrive.py and remain identical to the standalone planner.
lattice:
  frenet_target_speed: 13.89
  frenet_dt: 0.1
  frenet_time_horizon: 3.0
  frenet_time_horizons: [2.0, 3.0]
  frenet_speed_offsets: [0.0, -4.0, -8.0]
  frenet_lateral_sample_count: 5
  frenet_obstacle_check: true
  frenet_filter_off_lane_paths: true
  frenet_show_in_window: true

# Continuous SAC residual policy around the nominal Lattice solution.
residual_rl:
  enabled: false
  tdmpc2_checkpoint: null
  sac_checkpoint: null
  training_mode: sac_residual_frozen_wm
  device: cuda
  # symmetric_coarse_speed_v2 maps u_d to +/-delta_d_max. V4's
  # lane_width_coarse_speed_v4 maps it to +/-the current Lattice lane width.
  # Both mappings map u_v to +/-coarse_target_speed.
  action_mapping: symmetric_coarse_speed_v2
  delta_d_max: 0.4
  sigma_d: 0.4
  sigma_v: 2.0
  path_feature_scales: null
  path_feature_clip: 5.0
  include_wm_return_in_state: true
  include_wm_cost_in_state: false
  include_wm_uncertainty_in_state: false
  wm_return_state_scale: 10.0
  wm_cost_state_scale: 10.0
  wm_uncertainty_state_scale: 10.0
  wm_cost_gamma: null
  use_world_model_cost: false
  # Add discounted cost-Q at the end of the finite world-model rollout.
  # Enable only for checkpoints trained with cost.q_enabled=true.
  use_terminal_cost_q: false
  constraint_cost_source: environment
  use_uncertainty: true
  wm_cost_weight: 1.0
  wm_uncertainty_weight: 0.0
  wm_delta_weight: 0.1
  freeze_tdmpc2: true
  safe_fallback: true
  # V2-only compatibility parameters. V3 keeps both disabled/unused.
  trust_loss_weight: 0.0
  unsafe_residual_cost: 0.0
  lagrangian_pid: [0.05, 0.0005, 0.1]
  seed_steps: 5000
  learning_starts: 5000
  update_per_step: 0.2
  replay_size: 200000
  batch_size: 256
  n_step: 1
  gamma: 0.99
  actor_lr: 0.0005
  critic_lr: 0.001
  alpha_lr: 0.0003
  alpha: 0.005
  auto_alpha: true
  tau: 0.05
  use_lagrangian: true
  cost_limit: 10.0
  lagrangian_lr: 0.01
  lagrangian_rescaling: true
  hidden_sizes: [256, 256]
  checkpoint_every: 50000
  eval_every: 50000
  eval_episodes: 10
  log_every: 1000
  output_dir: logs/residual_sac
  online_wm_update_every: 1

comparison:
  episodes: 20
  scenario_seed: 20260916
  scenario_seed_limit: 10000
  output_dir: logs/visual_compare
  fps: 10
  frame_stride: 2
  panel_size: 640
  main_inset_width: 300
  gif_colors: 128
  max_steps: null

benchmark:
  episodes: 200
  scenario_seed: 20260916
  scenario_seed_limit: 10000
  traffic_densities: [0.1, 0.2]
  output_dir: logs/benchmark
  wandb_run_name: lattice_vs_v4_200_scenarios_density_01_02_seed1
  max_steps: null

flow:
  enabled: false
  model_type: x_start
  hidden_dim: 256
  num_layers: 4
  num_heads: 4
  dropout: 0.0
  condition_dim: 0
  condition_dropout: 0.1
  horizon: null
  num_flow_steps: 8
  num_samples: 64
  solver: midpoint
  cfg_scale: 1.0
  ema: false
  checkpoint: null

teacher:
  num_candidates: 512
  num_elites: 64
  selection_mode: value
  cost_lambda: 0.0
  diversity_filter: false
  diversity_threshold: 0.0
  dataset_path: datasets/flow_elites
  chunk_size: 8192
  rollout_steps: 10000

flow_train:
  batch_size: 256
  lr: 0.0003
  epochs: 10
  beta: 1.0
  weight_mode: none
  lambda_cost: 0.0
  min_weight: 0.05
  max_weight: 20.0
  lambda_smooth: 0.0
  lambda_cons: 0.0
  val_fraction: 0.05
  checkpoint_dir: logs/flow/checkpoints
  log_checkpoints_to_wandb: true

guidance:
  use_reward: true
  use_cost: false
  reward_scale: 0.0
  cost_scale: 0.0
  normalize_grad: true
  grad_clip: 1.0
  start_time: 0.0
  end_time: 1.0

cost:
  enabled: true
  gamma: 0.99
  loss_coef: 1.0
  q_enabled: false
  num_q: 2
  q_loss_coef: 1.0
  event_weights:
    cost: 1.0
    crash: 1.0
    crash_vehicle: 1.0
    crash_object: 1.0
    out_of_road: 1.0
    out_of_road_warning: 1.0

self_improve:
  enabled: false
  every_env_steps: 50000
  teacher_samples: 2048
  flow_updates: 1000
  dataset_max_size: 1000000
  log_checkpoints_to_wandb: true

# Policy prior
log_std_min: -10.0
log_std_max: 2.0
entropy_coef: 0.0001

# Q-functions / two-hot regression
num_bins: 101
vmin: -10.0
vmax: 10.0

# Full TD-MPC2 architecture. Valid sizes: 1, 5, 19, 48, 317.
model_size: 5
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 0
num_q: 5
dropout: 0.01
simnorm_dim: 8

# Logging
wandb_project: tdmpc2_metadrive
# null uses the account/entity associated with the current `wandb login`.
wandb_entity: null
wandb_run_name: null
wandb_silent: false
enable_wandb: true
save_csv: true
save_video: false
save_agent: true

# Runtime
compile: false
seed: 1
dry_run: false

# Values populated by parse_cfg/make_env.
work_dir: null
task_title: null
multitask: null
tasks: null
obs_shape: null
action_dim: null
episode_length: null
obs_shapes: null
action_dims: null
episode_lengths: null
bin_size: null

metadrive:
  simulator:
    use_render: false
    image_observation: false
    manual_control: false
    discrete_action: false
    action_check: false
    # Randomly sample 50 scenario seeds: 100,...,149 (upper bound 150 is exclusive).
    start_seed: 100
    num_scenarios: 50
    map: 3
    traffic_density: 0.1
    random_traffic: false
    accident_prob: 0.8
    remove_crashed_traffic_vehicle: false
    horizon: 1000
    truncate_as_terminate: false
    decision_repeat: 5
    out_of_road_done: true
    crash_vehicle_done: false
    crash_object_done: false
    cost_to_reward: false
    success_reward: 10.0
    out_of_road_penalty: 8.0
    crash_vehicle_penalty: 1.0
    crash_object_penalty: 1.0
    crash_vehicle_cost: 1.0
    crash_object_cost: 1.0
    out_of_road_cost: 1.0
    driving_reward: 1.0
    speed_reward: 0.12
    use_risk_field_reward: true
    risk_field_reward_scale: 25.0
    enable_idm_lane_change: true
    disable_idm_deceleration: false
    out_of_road_mode: legacy
    out_of_road_warning_limit: 5
    out_of_road_warning_penalty: 1.0
    out_of_road_warning_cost: 1.0
    out_of_road_recovery_steps: 15
    out_of_road_terminate_after_budget: true
    log_level: 50
    vehicle_config:
      lidar:
        num_lasers: 240
        distance: 50
        num_others: 0
        gaussian_noise: 0.0
        dropout_prob: 0.0
        add_others_navi: false

  # TD-MPC2 learns this scalar:
  # clip(base_reward_weight * MetaDriveReward - risk_penalty, reward_min, reward_max)
  reward:
    base_reward_weight: 1.0
    risk_field_reward_scale: 25.0
    reward_min: -10.0
    reward_max: 10.0

  # RiskFieldCalculator parameters copied from envs_0831/r2dreamer_metadrive.
  risk_field:
    risk_field_max_distance: 50.0
    risk_field_boundary_weight: 2.0
    risk_field_lane_weight: 0.1
    risk_field_offroad_weight: 2.0
    risk_field_vehicle_weight: 2.0
    risk_field_object_weight: 1.0
    risk_field_headway_weight: 0.0
    risk_field_ttc_weight: 0.0
    risk_field_boundary_sigma: 0.75
    risk_field_lane_edge_sigma: 0.75
    risk_field_broken_line_sigma: 0.1
    risk_field_lane_core_sigma_scale: 2.2
    risk_field_lane_shoulder_sigma_scale: 1.5
    risk_field_lane_shoulder_weight: 0.9
    risk_field_broken_line_factor: 0.1
    risk_field_solid_line_factor: 1.0
    risk_field_boundary_line_factor: 1.0
    risk_field_oncoming_line_factor: 1.5
    risk_field_offroad_cost: 1.0
    risk_field_offroad_sigma: 1.0
    risk_field_on_lane_margin: 0.05
    risk_field_vehicle_longitudinal_sigma: 6.8
    risk_field_vehicle_lateral_sigma: 2.0
    risk_field_vehicle_beta: 2.0
    risk_field_vehicle_dynamic_sigma_scale: 1.2
    risk_field_vehicle_dynamic_alpha: 0.35
    risk_field_vehicle_min_dynamic_sigma: 0.5
    risk_field_object_longitudinal_sigma: 5.5
    risk_field_object_lateral_sigma: 2.0
    risk_field_object_beta: 2.0
    risk_field_lane_beta: 2.0
    risk_field_headway_time_threshold: 1.2
    risk_field_ttc_threshold: 3.0
    risk_field_min_speed: 0.5
    risk_field_headway_cost_clip: 1.0
    risk_field_ttc_cost_clip: 1.0
    risk_field_raw_clip: 10.0

  cost:
    enabled: true
    risk_field_weight: 1.0
    event_weights:
      cost: 1.0
      crash: 1.0
      crash_vehicle: 1.0
      crash_object: 1.0
      out_of_road: 1.0
      out_of_road_warning: 1.0

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
